name: Release

on:
    push:
        tags:
            - "v*"

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4.2.2
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v4.4.0
              with:
                  node-version: 24

            - name: Install dependencies
              run: npm ci

            - name: Check version not already published
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  PUBLISHER=$(node -p "require('./package.json').publisher")
                  NAME=$(node -p "require('./package.json').name")
                  FULL="$PUBLISHER.$NAME"
                  echo "Checking if $FULL v$VERSION already exists on Marketplace..."
                  RESULT=$(curl -s -X POST "https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery?api-version=3.0-preview.1" \
                    -H "Content-Type: application/json" \
                    -H "Accept: application/json;api-version=3.0-preview.1" \
                    -d "{\"filters\":[{\"criteria\":[{\"filterType\":7,\"value\":\"$FULL\"}]}],\"flags\":512}" \
                    | node -e "const d=require('fs').readFileSync('/dev/stdin','utf8'); const r=JSON.parse(d); const v=r.results?.[0]?.extensions?.[0]?.versions?.[0]?.version; console.log(v||'none')")
                  echo "Latest published version: $RESULT"
                  if [ "$RESULT" = "$VERSION" ]; then
                    echo "❌ v$VERSION already published. Bump the version and re-release."
                    exit 1
                  fi
                  echo "✅ Version $VERSION is new. Proceeding..."

            - name: Package extension
              run: npx vsce package

            - name: Publish to Marketplace
              run: npx vsce publish
              env:
                  VSCE_PAT: ${{ secrets.VSCE_PAT }}

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  files: "*.vsix"
                  generate_release_notes: true
